<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display:grid;
            grid-template-columns:repeat(4,100px);
            grid-template-rows:repeat(6,100px);
            gap:10px;
        }
        .box1{
            background-color: red;  
            grid-column:1/2;
            border: 2px solid black;
        }
        .box2{
            background-color: green;
            grid-column:2/3;
            border: 2px solid black;
        }
        .box3{
            background-color: blue;
            grid-column:3/4;
            border: 2px solid black;
        }
        .box4{
            background-color: yellow;
            grid-row: 2/3;
            grid-column:1/2;
            border: 2px solid black;
        }
        .box5{
            background-color: cyan;
            grid-row: 2/3;
            grid-column:3/4;
            border: 2px solid black;
        }
        .box6{
            background-color: magenta;
            grid-row: 3/4;
            grid-column:1/2;
            border: 2px solid black;
        }
        .box7{
            background-color: orange;
            grid-row: 3/4;
            grid-column:2/3;
            border: 2px solid black;
        }
        .box8{
            background-color: pink;
            grid-row: 3/4;
            grid-column:3/4;
            border: 2px solid black;
        }
        .box9{
            background-color: purple;
            grid-row: 4/5;
            grid-column:1/2;
            border: 2px solid black;
        }
        .box10{
            background-color: brown;
            grid-row: 4/5;
            grid-column:2/3;
            border: 2px solid black;
        }
        .box11{
            background-color: gray;
            grid-row: 5/6;
            grid-column:1/2;
            border: 2px solid black;
        }
        .box12{
            background-color: black;
            grid-row: 5/6;
            grid-column:3/4;
            border: 2px solid black;
        }
        .box13{
            background-color: lightblue;
            grid-row: 6/7;
            grid-column:1/2;
            border: 2px solid black;
        }
        .box14{
            background-color: lightgreen;
            grid-row: 6/7;
            grid-column:4/5;
            border: 2px solid black;
        }   
        </style>
</head>
<body>
    <div class="container">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
        <div class="box5"></div>
        <div class="box6"></div>
        <div class="box7"></div>
        <div class="box8"></div>
        <div class="box9"></div>
        <div class="box10"></div>
        <div class="box11"></div>
        <div class="box12"></div>
        <div class="box13"></div>
        <div class="box14"></div>
        </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigation Bar with Dev Boxes</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      min-height:100vh;
      background:#ffffff;
      font-family:Arial, Helvetica, sans-serif;
      color:#111111;
      padding:16px 20px 24px;
    }

    .page-shell{
      width:min(1520px,100%);
      margin:0 auto;
    }

    .navbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      padding:14px 18px;
      background:#ffffff;
      border:1px solid #d9d9d9;
      border-radius:14px;
      box-shadow:0 8px 24px rgba(0,0,0,0.05);
      position:fixed;
      top:0;
      left:0;
      right:0;
      z-index:1000;
    }

    .nav-left,
    .nav-center,
    .nav-right{
      display:flex;
      align-items:center;
    }

    .nav-left{
      gap:10px;
      flex:0 0 auto;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:0;
    }

    .brand-text{
      font-size:22px;
      font-weight:700;
      letter-spacing:0.2px;
      background-color:#991111
    }

    .nav-center{
      flex:1;
      justify-content:center;
      min-width:0;
    }

    .search-shell{
      width:min(720px, 100%);
      display:flex;
      align-items:center;
    }

    .search-box{
      flex:1;
      height:46px;
      border:1px solid #d7d7d7;
      border-right:none;
      border-radius:999px 0 0 999px;
      background:#fff;
      padding:0 18px;
      outline:none;
    }

    .search-box::placeholder{
      color:#808080;
    }

    .search-btn,
    .scroll-btn{
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px solid #d7d7d7;
      background:#f8f8f8;
      cursor:pointer;
    }

    .search-btn{
      width:64px;
      height:46px;
      border-radius:0 999px 999px 0;
      border-left:none;
      font-size:15px;
      font-weight:700;
      color:#303030;
    }

    .nav-right{
      gap:10px;
      flex:0 0 auto;
    }

    .scroll-btn{
      width:auto;
      min-width:138px;
      height:44px;
      padding:0 16px;
      border-radius:999px;
      font-weight:700;
      color:#111111;
    }

    .scroll-btn:active,
    .search-btn:active{
      transform:translateY(1px);
    }

    .page-section{
      width:100%;
      margin:18px 0 0;
    }

    .dev-layout{
      display:grid;
      gap:26px;
      padding-top:6px;
    }

    .dev-row{
      display:grid;
      gap:26px;
    }

    .dev-row.top{
      grid-template-columns:1fr 1fr 0.5fr;
    }

    .dev-row.middle{
      grid-template-columns:repeat(4, 1fr);
    }

    .dev-card{
      border:1px solid #dcdcdc;
      border-radius:16px;
      background:#ffffff;
      padding:10px;
    }

    .dev-card-inner{
      width:100%;
      height:100%;
      min-height:250px;
      border-radius:12px;
      background:#ececec;
    }

    .dev-row.top .dev-card{
      min-height:348px;
    }

    .dev-row.top .dev-card-inner{
      min-height:328px;
      background:#dddddd;
    }

    .dev-row.middle .dev-card{
      min-height:220px;
    }

    .dev-row.middle .dev-card-inner{
      min-height:248px;
    }

    .dev-strip{
      width:100%;
      min-height:100px;
      border:1px solid #dcdcdc;
      border-radius:14px;
      background:#ffffff;
    }

    .top-strip{
      width:100%;
      height:70px;
      margin-top:18px;
      border-radius:12px;
      border:1px solid #dcdcdc;
      background:#ffffff;
    }

    /* TAG / PILL LIST */
    .tag-list{
      margin-top:60px;
      display:flex;
      align-items:center;
      gap:12px;
      padding:10px 12px;
      background:#991111;
      overflow:hidden;
    }

    .tag-scroller{
      display:flex;
      gap:12px;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
      padding-bottom:6px;
    }

    .tag-scroller::-webkit-scrollbar{ display:none; }

    .tag-pill{
      flex:0 0 auto;
      padding:8px 14px;
      background:#2a2a2a;
      color:#fff;
      border-radius:999px;
      font-weight:700;
      font-size:14px;
      border:1px solid rgba(255,255,255,0.06);
      cursor:pointer;
      white-space:nowrap;
    }

    .tag-pill.active{
      background:#fff;
      color:#111;
      box-shadow:0 6px 18px rgba(0,0,0,0.25);
    }

    .tag-more{
      margin-left:auto;
      flex:0 0 auto;
      background:transparent;
      border:none;
      color:#fff;
      font-size:18px;
      width:44px;
      height:44px;
      border-radius:999px;
      display:grid;
      place-items:center;
      cursor:pointer;
    }

    .footer-box{
      width:100%;
      height:100px;
      margin-top:18px;
      border-radius:12px;
      border:1px solid #dcdcdc;
      background:#ffffff;
    }

    @media (max-width: 900px){
      .navbar{
        flex-wrap:wrap;
      }

      .nav-center{
        order:3;
        flex-basis:100%;
      }

      .search-shell{
        width:100%;
      }

      .nav-right{
        width:100%;
        justify-content:flex-end;
      }

      .dev-row.top,
      .dev-row.middle{
        grid-template-columns:1fr;
      }

      .dev-card,
      .dev-card-inner{
        min-height:220px;
      }
    }
  </style>
</head>
<body>

  <div class="page-shell">

    <div class="navbar">

      <div class="nav-left">
        <div class="brand-text" aria-label="YouTube">YouTube</div>
      </div>

      <div class="nav-center">
        <div class="search-shell">
          <input class="search-box" type="text" placeholder="Search" aria-label="Search" />
          <button class="search-btn" type="button" aria-label="Search">Search</button>
        </div>
      </div>

      <div class="nav-right">
        <button class="scroll-btn" type="button" onclick="scrollDown()">Go to Boxes</button>
      </div>

    </div>

    <!-- TAG / PILL LIST -->
    <div class="tag-list" aria-label="Tags">
      <div class="tag-scroller">
        <button class="tag-pill">Dubbing</button>
        <button class="tag-pill">Trending</button>
        <button class="tag-pill">Bollywood</button>
        <button class="tag-pill">Gaming</button>
        <button class="tag-pill">Roadies</button>
        <button class="tag-pill">Music</button>
        <button class="tag-pill">Dhurandhar</button>
        <button class="tag-pill">Samay Raina</button>
        <button class="tag-pill">Romantic comedies</button>
        <button class="tag-pill">Mrunal Thakur</button>
        <button class="tag-pill">Comedy clubs</button>
      </div>
      <button class="tag-more" aria-hidden="true">›</button>
    </div>

    <section class="top-strip" aria-hidden="true"></section>

    <section class="page-section" id="content">

      <div class="dev-layout">

        <div class="dev-row top">
          <div class="dev-card"><div class="dev-card-inner"></div></div>
          <div class="dev-card"><div class="dev-card-inner"></div></div>
          <div class="dev-card"><div class="dev-card-inner"></div></div>
        </div>

        <div class="dev-row middle">
          <div class="dev-card"><div class="dev-card-inner"></div></div>
          <div class="dev-card"><div class="dev-card-inner"></div></div>
          <div class="dev-card"><div class="dev-card-inner"></div></div>
          <div class="dev-card"><div class="dev-card-inner"></div></div>
        </div>

        <div class="dev-strip"></div>

      </div>

    </section>

  </div>

  <script>
    function scrollDown(){
      document.getElementById('content').scrollIntoView({ behavior: 'smooth' });
    }
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', function(){
      const pills = document.querySelectorAll('.tag-pill');
      pills.forEach(p => p.addEventListener('click', () => {
        pills.forEach(x => x.classList.remove('active'));
        p.classList.add('active');
      }));

      const scroller = document.querySelector('.tag-scroller');
      const more = document.querySelector('.tag-more');
      if(more && scroller){
        more.addEventListener('click', () => scroller.scrollBy({ left: 240, behavior: 'smooth' }));
      }
    });
  </script>

</body>
</html>

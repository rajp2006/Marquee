<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display:grid;
            height:450px;
            width:700px;
            grid-template-columns: 200px 1fr 200px;
            grid-template-rows:80px 1fr 60px;
            grid-template-areas:
            "shivay shivay shivay"
            "bhopal Ujjain indore"
            "Rakesh Rakesh Rakesh";
            gap:12px;
            justify-items: center;
            align-items: center;
            place-items: center;
            justify-content: center;
            align-content: center;
        }
        .header{
            background-color: red;
            grid-area: shivay;
            height: 50px;
            width: 50px;
        }
        .sidebar{
            background-color: green;
            grid-area: bhopal;
            height: 50px;
            width: 50px;
        }
        .main{
            background-color: blue;
            grid-area: Ujjain;
            height: 50px;
            width: 50px;
        }
        .aside{
            background-color: yellow;
            grid-area: indore;
            height: 50px;
            width: 50px;
        }
        .footer{
            background-color: cyan;
            grid-area: Rakesh;
            height: 50px;
            width: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Shivay</div>
        <div class="sidebar">Bhopal</div>
        <div class="main">Ujjain</div>
        <div class="aside">Indore</div>
        <div class="footer">Rakesh</div>
    </div>
</body>
</html>

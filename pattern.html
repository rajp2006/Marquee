<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display:grid;
            grid-template-columns:100px 1fr 100px;
            grid-template-rows:160px 260px 160px;
            gap:15px;
        }
        .box1{
            background-color: red;  
            border: 2px solid black;
            height: 50px;
            width: 50px;
            justify-self: end;
            align-self: end;
        }
        .box2{
            background-color: green;
            border: 2px solid black;
             height: 50px;
            width: 50px;
            justify-self: center;
            align-self: center;
        }
        .box3{
            background-color: blue;
            border: 2px solid black;
                height: 50px;
            width: 50px;
            align-self: end;
        }
        .box4{
            background-color: yellow;
            border: 2px solid black;
            height: 50px;
            width: 50px;
            
        }
        .box5{
            background-color: cyan;
            border: 2px solid black;
            height: 50px;
            width: 50px;
            align-self: end;
            justify-self: center;
            
        }
        .box6{
            background-color: magenta;
            border: 2px solid black;
            height: 50px;
            width: 50px;
            justify-self: end;
            
        }
        .box7{
            background-color: orange;
            border: 2px solid black;
            height: 50px;
            width: 50px;
            justify-self: end;
             align-self: center;
                
        }
        .box8{
            background-color: pink;
            border: 2px solid black;height: 50px;
            width: 50px;
            justify-self: start;
                align-self: center;
        }
        .box9{
            background-color: purple;
            border: 2px solid black;
            height: 50px;
            width: 50px;
            justify-self: start;
                align-self: center;
        }
        </style>
</head>
<body>
     <div class="container">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
        <div class="box5"></div>
        <div class="box6"></div>
        <div class="box7"></div>
        <div class="box8"></div>
        <div class="box9"></div>
        </div>
</body>
</html>
